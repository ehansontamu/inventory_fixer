name: Inventory Fixer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-fixer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run inventory fixer
        env:
          FILTERED_JSON_URL: ${{ secrets.FILTERED_JSON_URL }}
          BC_STORE_ID: ${{ secrets.BC_STORE_ID }}
          BC_AUTH_TOKEN: ${{ secrets.BC_AUTH_TOKEN }}
          # Optional (not sensitive but keeping env-driven):
          BC_BASE_URL: ${{ secrets.BC_BASE_URL }}
          BC_LOCATION_ID: ${{ secrets.BC_LOCATION_ID }}
          ADJUSTMENT_REASON: ${{ secrets.ADJUSTMENT_REASON }}
        run: |
          python inventory_fixer.py
